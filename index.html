<!DOCTYPE html>
<html>

<head>
    <title>The Archive</title>

    <style>
        body {
            background-color: #171512;
            color: #E8E1D5;
            font-family: Georgia, serif;
            text-align: center;
            padding: 50px;
            margin: 0;

            height: 100vh;
            box-sizing: border-box;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .archive {
            width: 100%;
            max-width: 500px;
        }

        .small {
            font-family: Arial, sans-serif;
            font-size: 12px;
            letter-spacing: 4px;
            text-transform: uppercase;
            opacity: 0.55;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 48px;
            font-weight: normal;
            margin: 0 0 15px 0;
        }

        .description {
            font-size: 17px;
            font-style: italic;
            opacity: 0.7;
            margin-bottom: 45px;
        }

        input {
            width: 260px;
            padding: 14px;
            box-sizing: border-box;

            background: transparent;
            border: none;
            border-bottom: 1px solid #E8E1D5;

            color: #E8E1D5;
            font-family: Georgia, serif;
            font-size: 16px;
            text-align: center;

            outline: none;
        }

        input::placeholder {
            color: #E8E1D5;
            opacity: 0.4;
        }

        button {
            display: block;
            margin: 25px auto 0 auto;

            background: transparent;
            color: #E8E1D5;

            border: 1px solid #E8E1D5;
            padding: 12px 28px;

            font-family: Georgia, serif;
            font-size: 15px;

            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #E8E1D5;
            color: #171512;
        }

        #error {
            margin-top: 20px;
            font-size: 13px;
            opacity: 0.6;
            display: none;
        }
    </style>
</head>


<body>

    <div class="archive">

        <div class="small">Private archive</div>

        <h1>The Archive</h1>

        <div class="description">
            Some things are not meant for everyone.
        </div>

        <input 
            type="password" 
            id="password"
            placeholder="enter password"
        >

        <button onclick="enterArchive()">Enter</button>

        <div id="error">
            The password is incorrect.
        </div>

    </div>


    <script>

    function enterArchive() {

        const password = document.getElementById("password").value;

        if (password === "In this paradox of old There is a story I’d like to be told I can’t say it loud And yet I’m proud You see my words in puzzles Behind lines that are me Because my voice can’t be free This is the access This is the key Guarantee me That you won’t leak me Now enter the world Of my mind And maybe you even might Find a bit of yourself tonight") {

            window.location.href = "home.html";

        } else {

            document.getElementById("error").style.display = "block";

        }

    }

</script>

</body>

</html>
